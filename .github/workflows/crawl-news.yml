name: ニュースクロール (毎時)

on:
  schedule:
    # 毎時0分に実行 (JST 毎時)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '--dry'
          - '--check'

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ニュースクロール実行
        run: node scripts/crawl-news.js ${{ github.event.inputs.mode }}

      - name: 更新確認・コミット・プッシュ
        run: |
          git config user.name "WAKATE News Bot"
          git config user.email "bot@wakate.example.com"

          if git diff --quiet src/data/news.json; then
            echo "更新なし"
          else
            ADDED=$(git diff src/data/news.json | grep '^+.*"title"' | wc -l)
            git add src/data/news.json scripts/.seen-urls.json
            git commit -m "auto: ニュース更新 (+${ADDED}件) $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ ${ADDED}件の新着ニュースをコミットしました"
          fi

      - name: クロールログをアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-log-${{ github.run_id }}
          path: scripts/crawl.log
          retention-days: 7
